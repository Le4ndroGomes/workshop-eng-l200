# Databricks Asset Bundle (opcional) — Workshop Amil x Databricks (L200)
# Alternativa ao deploy.sh para publicar os artefatos do workshop.
#
# Uso:
#   databricks bundle deploy -t dev
#
bundle:
  name: amil-workshop-trilha-tech

targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405610863872788.8.azuredatabricks.net
      root_path: /Workspace/Shared/amil-workshop-trilha-tech/.bundle/${bundle.name}

